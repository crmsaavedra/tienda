<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión | Autopartes Pro</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css">
<style>
.login-page{min-height:calc(100dvh - 74px);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%);padding:40px 20px}
.login-card{background:#fff;padding:48px 40px;max-width:440px;width:100%;border-radius:16px;box-shadow:0 25px 50px -12px rgb(0 0 0 / 0.25)}
.login-card .eyebrow{margin:0 0 8px; color:var(--orange, #f97316); font-weight:700; letter-spacing:1px; font-size:12px; text-transform:uppercase}
.login-card h1{font:700 40px 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0 0 10px;color:var(--navy, #0f172a)}
.login-card p{color:var(--muted, #64748b);line-height:1.6;margin:0 0 32px;font-size:15px}
.login-card form{display:grid;gap:18px}
.login-card input{border:1px solid #cbd5e1;padding:16px;font:inherit;width:100%;background:#f8fafc;border-radius:8px;transition:all 0.2s}
.login-card input:focus{outline:none;border-color:var(--orange, #f97316);background:#fff;box-shadow:0 0 0 4px rgba(249,115,22,0.1)}
.login-card .primary{text-align:center;font-size:16px;padding:16px;border-radius:8px;font-weight:600;margin-top:10px}
.login-card .feedback{color:#ef4444;font-size:14px;min-height:20px;margin:0;font-weight:500}
.login-card .alt{text-align:center;color:var(--muted, #64748b);font-size:14px;margin-top:24px}
.login-card .alt a{color:var(--orange, #f97316);font-weight:600;text-decoration:none;transition:opacity 0.2s}
.login-card .alt a:hover{opacity:0.8}
.login-card .divider{display:flex;align-items:center;gap:16px;color:#94a3b8;font-size:13px;margin:12px 0}
.login-card .divider::before,.login-card .divider::after{content:"";flex:1;border-top:1px solid #e2e8f0}
</style></head><body>
<header><a class="logo" href="/"><span>AP</span> AUTOPARTES <b>PRO</b></a><nav><a href="/#catalogo">Repuestos</a><a href="/#confianza">Garantías</a></nav></header>
<main class="login-page">
<div class="login-card">
<p class="eyebrow">ACCESO ADMINISTRATIVO</p>
<h1>Iniciar sesión</h1>
<p>Ingresa tus credenciales para acceder al panel de administración.</p>
<p class="feedback" id="login-feedback" aria-live="polite"></p>
<form id="login-form">
<input name="name" placeholder="Nombre completo (solo registro)" autocomplete="name">
<input name="email" type="email" placeholder="Email" required autocomplete="email">
<input name="password" type="password" placeholder="Contraseña (mín. 8 caracteres)" required autocomplete="current-password">
<button class="primary full">Ingresar</button>
</form>
<div class="divider">o</div>
<p class="alt">Si no tienes cuenta, se creará automáticamente al ingresar.<br><a href="/">← Volver a la tienda</a></p>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
if(localStorage.apToken){try{const p=JSON.parse(atob(localStorage.apToken.split('.')[1]));if(p.role==='admin'&&p.exp*1000>Date.now()){location.replace('/admin')}}catch{}}
$('#login-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const feedback=$('#login-feedback');feedback.textContent='';
async function api(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}
try{let data;try{data=await api('/api/auth/login',{email:f.get('email'),password:f.get('password')})}catch{data=await api('/api/auth/register',Object.fromEntries(f))}
localStorage.apToken=data.token;const dest=new URLSearchParams(location.search).get('next')||'/admin';location.replace(dest)}catch(err){feedback.textContent=err.message}};
</script></body></html>
