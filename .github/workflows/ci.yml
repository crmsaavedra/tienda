name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Backend tests (API)
        run: npm test
        env:
          JWT_SECRET: ci-secret
          RATE_LIMIT_AUTH: '60'
      - name: Build cliente (Vite)
        run: npm run check