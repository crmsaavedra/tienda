<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Página no encontrada | Autopartes Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .error-page {
      min-height: calc(100vh - 74px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: var(--ice, #f8fafc);
    }
    .error-card {
      background: #fff;
      padding: 64px 48px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1);
      max-width: 500px;
      width: 100%;
    }
    .error-code {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 80px;
      font-weight: 700;
      color: var(--orange, #f97316);
      line-height: 1;
      margin: 0 0 16px;
    }
    .error-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 32px;
      color: var(--navy, #0f172a);
      text-transform: uppercase;
      margin: 0 0 16px;
    }
    .error-text {
      color: var(--muted, #64748b);
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 32px;
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/"><span>AP</span> AUTOPARTES <b>PRO</b></a>
    <nav>
      <a href="/#catalogo">Repuestos</a>
      <a href="/#confianza">Garantías</a>
    </nav>
  </header>
  <main class="error-page">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Página no encontrada</h1>
      <p class="error-text">Lo sentimos, no pudimos encontrar la pieza que estás buscando. Es posible que el enlace esté roto o que la página haya sido eliminada.</p>
      <a href="/" class="primary full" style="display:inline-block; text-align:center; padding:14px; border-radius:8px; text-decoration:none;">Volver a la tienda</a>
    </div>
  </main>
</body>
</html>
